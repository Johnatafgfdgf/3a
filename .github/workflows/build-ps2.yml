name: Build MinePS2 ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: h4570/tyra
    timeout-minutes: 45

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git make python3 genisoimage

      - name: Set git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate game assets
        run: python3 tools/gen_assets.py

      - name: Clone Tyra
        run: git clone --depth 1 https://github.com/h4570/tyra.git tyra

      - name: Install project into Tyra tutorials
        run: |
          rm -rf tyra/tutorials/12-mineps2
          cp -R MinePS2_Basic tyra/tutorials/12-mineps2

      - name: Build Tyra engine
        run: make clean all -C tyra/engine

      - name: Build MinePS2 ELF
        run: make clean all -C tyra/tutorials/12-mineps2

      - name: Verify ELF
        run: |
          test -f tyra/tutorials/12-mineps2/bin/mineps2.elf
          ls -lh tyra/tutorials/12-mineps2/bin/mineps2.elf

      - name: Build PS2 ISO
        run: |
          rm -rf iso_root
          mkdir -p iso_root
          cp tyra/tutorials/12-mineps2/bin/mineps2.elf iso_root/MINEPS2.ELF
          cp tyra/tutorials/12-mineps2/bin/*.png iso_root/
          printf 'BOOT2 = cdrom0:\\MINEPS2.ELF;1\nVER = 1.00\nVMODE = NTSC\n' > iso_root/SYSTEM.CNF
          genisoimage -quiet -o MinePS2_TEST.iso -V MINEPS2 -iso-level 2 -J -R iso_root
          ls -lh MinePS2_TEST.iso
          sha256sum MinePS2_TEST.iso > MinePS2_TEST.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinePS2-PS2-test-build
          path: |
            MinePS2_TEST.iso
            MinePS2_TEST.iso.sha256
            tyra/tutorials/12-mineps2/bin/mineps2.elf
          if-no-files-found: error
          compression-level: 0
